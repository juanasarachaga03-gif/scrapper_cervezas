name: Publicar historico de reportes en Releases (manual)

# Se corre a mano una sola vez (Actions > este workflow > Run workflow).
# Toma los artifacts "Reportes-Del-Dia" que todavia no vencieron y publica,
# por cada dia, los Reporte_*.xlsx de la ULTIMA corrida de ese dia en un
# Release "reportes-AAAA-MM-DD", para que se puedan bajar sin login.

on:
  # Corre solo cuando se modifica este mismo archivo (usa la fecha por defecto)
  # y se puede volver a correr a mano con otra fecha. Es idempotente.
  push:
    paths:
      - '.github/workflows/publicar_historico.yml'
  workflow_dispatch:
    inputs:
      desde:
        description: 'Publicar desde esta fecha (AAAA-MM-DD, hora Argentina)'
        required: true
        default: '2026-09-26'

permissions:
  contents: write
  actions: read

jobs:
  publicar:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      DESDE: ${{ inputs.desde || '2026-09-26' }}
    steps:
      - name: Validar fecha
        run: |
          [[ "$DESDE" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]] || { echo "Fecha invalida: $DESDE"; exit 1; }

      - name: Elegir la ultima corrida de cada dia
        run: |
          set -euo pipefail
          gh api --paginate "repos/$GH_REPO/actions/artifacts?per_page=100" \
            --jq '.artifacts[] | select(.name=="Reportes-Del-Dia" and .expired==false) | [.workflow_run.id, .created_at] | @tsv' \
          | while IFS=$'\t' read -r run_id created_at; do
              dia=$(TZ=America/Argentina/Buenos_Aires date -d "$created_at" +%Y-%m-%d)
              printf '%s\t%s\t%s\n' "$dia" "$created_at" "$run_id"
            done \
          | sort -k1,1 -k2,2 \
          | awk -F'\t' '{ultima[$1]=$3} END {for (d in ultima) print d "\t" ultima[d]}' \
          | sort > dias.tsv
          echo "Dias con artifact vigente:"
          cat dias.tsv

      - name: Descargar y publicar cada dia
        run: |
          set -euo pipefail
          while IFS=$'\t' read -r dia run_id; do
            if [[ "$dia" < "$DESDE" ]]; then continue; fi
            echo "== $dia (corrida $run_id) =="
            rm -rf "dl/$dia"
            mkdir -p "dl/$dia"
            gh run download "$run_id" -n Reportes-Del-Dia -D "dl/$dia"
            mapfile -t archivos < <(find "dl/$dia" -name 'Reporte_*.xlsx')
            if [ "${#archivos[@]}" -eq 0 ]; then
              echo "AVISO: la corrida $run_id no trae Reporte_*.xlsx, se saltea $dia"
              continue
            fi
            TAG="reportes-$dia"
            if ! gh release view "$TAG" >/dev/null 2>&1; then
              gh release create "$TAG" \
                --title "Reportes $dia" \
                --notes "Reportes diarios del $dia (publicados desde el historial de Actions)." \
                --latest=false
            fi
            gh release upload "$TAG" "${archivos[@]}" --clobber
          done < dias.tsv
