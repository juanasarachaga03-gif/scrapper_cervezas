name: Ejecutar Scraper de Cervezas

on:
  workflow_dispatch: # Botón manual
  schedule:
    - cron: '0 11 * * *' # Corre todos los días a las 08:00 AM (Argentina)

jobs:
  scraping:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Descargar repositorio y archivos
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar librerías
        run: |
          python -m pip install --upgrade pip
          pip install pandas requests openpyxl urllib3

      - name: Ejecutar scraper
        run: python script.py

      - name: Guardar nuevo Excel en el repositorio
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add *.xlsx *.csv
          git commit -m "Auto: subida de reporte diario" || echo "No hay archivos nuevos"
          git push
