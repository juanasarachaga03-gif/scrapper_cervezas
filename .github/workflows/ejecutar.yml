name: Ejecutar Scraper de Cervezas

on:
  workflow_dispatch:
  schedule:
    - cron: '0 11 * * *'

jobs:
  scraping:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio y archivos
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar librerías
        run: |
          python -m pip install --upgrade pip
          pip install pandas requests openpyxl urllib3 pyarrow fastparquet xlsxwriter

      - name: Ejecutar scraper
        run: python script.py

      - name: Separar solo el Excel nuevo del día
        run: |
          mkdir -p descargas
          cp *.xlsx descargas/ 2>/dev/null || true

      - name: Preparar descarga
        uses: actions/upload-artifact@v4
        with:
          name: Reporte-del-dia
          path: descargas/*.xlsx
