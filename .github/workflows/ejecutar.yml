name: Ejecutar Scraper de Cervezas

on:
  workflow_dispatch: # Botón manual
  schedule:
    - cron: '0 11 * * *' # Corre automático a las 08:00 AM (Argentina)

jobs:
  scraping:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio y archivos
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar librerías
        run: |
          python -m pip install --upgrade pip
          pip install pandas requests openpyxl urllib3

      - name: Ejecutar scraper
        run: python script.py

      - name: Separar solo el Excel nuevo del día
        run: |
          mkdir -p descargas
          # Detecta los archivos nuevos o modificados por el script y los copia a la carpeta descargas
          git status --porcelain | awk '{print $2}' | grep '\.xlsx$' | xargs -I {} cp {} descargas/ || true

      - name: Preparar descarga
        uses: actions/upload-artifact@v4
        with:
          name: Reporte-del-dia
          path: descargas/*.xlsx
      - name: Instalar librerías
              run: |
                python -m pip install --upgrade pip
                pip install pandas requests openpyxl urllib3 pyarrow fastparquet xlsxwriter
