name: Ejecutar Scrapers Diarios

on:
  workflow_dispatch:
  schedule:
    - cron: '0 11 * * *' # 08:00 AM Argentina

jobs:
  scraping:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio y archivos
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar librerías
        run: |
          python -m pip install --upgrade pip
          pip install pandas requests openpyxl urllib3 pyarrow fastparquet xlsxwriter beautifulsoup4 lxml playwright

      - name: Instalar navegador de Playwright (para Rappi)
        run: python -m playwright install --with-deps chromium

      - name: Ejecutar Scraper Cervezas
        run: python script.py

      - name: Ejecutar Scraper Interior
        run: python main.py

      - name: Ejecutar Last Millers (PedidosYa + Rappi)
        # No corta el workflow si falla: PedidosYa puede bloquear la IP de
        # datacenter de GitHub Actions (igual que le pasa a pedidosya-nunez).
        # Si falla, los reportes de Cadenas Nacionales / Interior salen igual.
        continue-on-error: true
        run: python last_millers.py

      - name: Crear carpeta unificada de descarga
        run: |
          mkdir -p reportes_finales
          cp Reporte_*.xlsx reportes_finales/ 2>/dev/null || true
          cp *.xlsx reportes_finales/ 2>/dev/null || true

      - name: Preparar descarga unificada
        uses: actions/upload-artifact@v4
        with:
          name: Reportes-Del-Dia
          path: reportes_finales/*.xlsx
