name: Ejecutar Scrapers Diarios

on:
  workflow_dispatch:
  schedule:
    - cron: '0 11 * * *' # 08:00 AM Argentina

jobs:
  scraping:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio y archivos
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar librerías
        run: |
          python -m pip install --upgrade pip
          pip install pandas requests openpyxl urllib3 pyarrow fastparquet xlsxwriter beautifulsoup4 lxml

      - name: Ejecutar Scraper Cervezas
        run: python script_cervezas.py

      - name: Ejecutar Scraper Interior
        run: python main_interior.py

      - name: Crear carpeta unificada de descarga
        run: |
          mkdir -p reportes_finales
          # Copia todos los reportes generados por ambos scripts
          cp Reporte_*.xlsx reportes_finales/ 2>/dev/null || true

      - name: Preparar descarga unificada
        uses: actions/upload-artifact@v4
        with:
          name: Reportes-Del-Dia
          path: reportes_finales/*.xlsx
